name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.2"
      - "v0.2.*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set Version From Tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: ./build-release.sh --version-name "$VERSION_NAME" --version-code "$VERSION_CODE"

      - name: Rename APK For Release
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          OUT_PATH="android/app/build/outputs/apk/release/app-release-${VERSION_NAME}.apk"
          cp "$APK_PATH" "$OUT_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/app-release-${{ env.VERSION_NAME }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release-${{ env.VERSION_NAME }}.apk
